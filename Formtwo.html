<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2> JOB APPLIATION </h2>
    <form>
         <label for="name">Name:</label>
        <input type="text" id="name" name="name">
        <br/>
        <br/>

        <label for="email">Email ID:</label>
        <input type="email" id="emailID" name="emailID">
        <br/>
        <br/>

        <label for="phone no.">Phone No.:</label>
        <input type="tel" id="Phone No." name="phone No.">
        <br/>
        <br/>

        <label for="resume"> Resume: </label>
        <input type="file" id="fileupload" name="fileupload">
        <br/>
        <br/>

        <label for="counter"> Experience (in years):</label>
        <input type="number" id="counter" name="counter" min="0" max="50">
        <br/>
        <br/>

        
        <fieldset>
            <legend> Skills: </legend>
            <br/>

            <label for="checkbox1">HTML</label>
            <input type="checkbox" name="checkbox" id="checkbox1">
            <br/>
            <br/>

            <label for="checkbox2">CSS</label>
            <input type="checkbox" name="checkbox" id="checkbox2">
            <br/>
            <br/>

            <label for="checkbox3">JAVA SCRIPT </label>
            <input type="checkbox" name="checkbox" id="checkbox3">
            <br/>
            <br/>
        </fieldset>
        <br/>

         <label for="Education Type"> Highest Education: </label>
        <select name="Education type" id="Education type">
            <option value="High School">High School</option>
            <option value="Associative's Degree">Associative's Degree</option>
            <option value="Bachelor's Degree">Bachelor's Degree</option>
            <option value="Master's Degree">Master's Degree</option>
            <option value="PHD">PHD</option>
        </select> 
        <br/>
        <br/>

        <fieldset>
            <legend> Availabilty: </legend>
            <br/>

            <label for="radio1">Full time:</label>
            <input type="Radio" name="radio" id="radio1">
            <br/>
            <br/>

            <label for="radio2">Part Time</label>
            <input type="radio" name="radio" id="radio2">
            <br/>
            <br/>

        </fieldset>
        <br/>
        <br/>

        <label for="teaxtarea1"> Additional Comments:</label>
        <br/>
        <textarea name="textarea1" id="textarea1" cols="30" rows="10"></textarea>

        <input type="submit" value="Submit Aplication">


        
    <form>
</body>
</html>
