<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registeration</title>
</head>
<body>
    <h2> Event Registeration </h2>
    <form>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name">
        <br/>
        <br/>

        <label for="email">Email ID:</label>
        <input type="email" id="emailID" name="emailID">
        <br/>
        <br/>

        <label for="phone no.">Phone No.:</label>
        <input type="tel" id="Phone No." name="phone No.">
        <br/>
        <br/>

        <label for="occupationType">Occupation:</label>
        <select name="occupationType" id="occupation type">
            <option value="student">Student</option>
            <option value="Professional">Professional</option>
            <option value="other">Other</option>
        </select> 
        <br/>
        <br/>

        <fieldset>
            <legend> Topics of Interest: </legend>
            <br/>

            <label for="checkbox1">HTML</label>
            <input type="checkbox" name="checkbox" id="checkbox1">
            <br/>

            <label for="checkbox2">CSS</label>
            <input type="checkbox" name="checkbox" id="checkbox2">
            <br/>

            <label for="checkbox3">JAVA SCRIPT </label>
            <input type="checkbox" name="checkbox" id="checkbox3">
            <br/>
        </fieldset>

        <label for="textarea1">Comments:</label>
        <br/>
        <textarea name="textarea1" id="textarea1" cols="100"></textarea>

        <input type="submit" value="Register">


    </form>
</body>
</html>
